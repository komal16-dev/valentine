<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Swapnil 🤍</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card {
    background: white;
    padding: 35px;
    max-width: 420px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: fade 0.8s ease;
  }
  h2 { color: #ff4d6d; }
  p { color: #444; line-height: 1.6; }
  button {
    margin-top: 14px;
    padding: 12px 24px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  .primary { background: #ff4d6d; color: white; }
  .secondary { background: #eee; color: #333; }
  button:hover { transform: scale(1.05); }

  @keyframes fade {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>
<div class="card" id="card"></div>

<script>
const card = document.getElementById("card");

/* SCENE 1 — ENTRY */
function scene1() {
  card.innerHTML = `
    <h2> Just for you 💕</h2>
    <p>
      This is a serious message.<br>
      By serious, I mean… me.
    </p>
    <button class="primary" onclick="scene2()">I’m ready</button>
    <button class="secondary" onclick="scene2()">I already regret this</button>
  `;
}

/* SCENE 2 — COMMITMENT TEASE */
function scene2() {
  card.innerHTML = `
    <h2>Good 😌</h2>
    <p>
      You clicked.<br>
      That already says a lot.
    </p>
    <button class="primary" onclick="scene3()">Continue</button>
    <button class="secondary" onclick="scene3()">I feel trapped</button>
  `;
}

/* SCENE 3 — DRAMA DILEMMA */
function scene3() {
  card.innerHTML = `
    <h2>Quick question</h2>
    <p>
      You’re dealing with all my drama these days..<br>
      What do you think, how you handle it?
    </p>
    <button class="primary" onclick="scene4()">By staying calm</button>
    <button class="secondary" onclick="scene4()">Already gave up on me?</button>
  `;
}

/* SCENE 4 — LAUGH IT OFF */
function scene4() {
  card.innerHTML = `
    <h2>Interesting 🤍</h2>
    <p>
      Because whether you try to stay calm…<br>
      or you give up…<br><br>
      <strong>You already gave up long back 😆</strong>
    </p>
    <p>Relax, I’m smiling.</p>
    <button class="primary" onclick="scene5()">Okay 😅</button>
    <button class="secondary" onclick="scene5()">I had no choice</button>
  `;
}

/* SCENE 5 — THE QUESTION (YES / NO PROPERLY) */
function scene5() {
  card.innerHTML = `
    <h2>One last thing before this ends💌</h2>
    <p>
      They say Valentine’s is about love, but for me, it’s about you.
About the comfort, the smiles, and the quiet happiness you bring into my life.
I don’t want to overthink it - just feel it.
So tell me…<br><br>
      Will you be my Valentine?
    </p>
    <button class="primary" onclick="yesPath()">Yes 💖</button>
    <button class="secondary" onclick="noPath()">No 😐</button>
  `;
}

/* YES PATH */
function yesPath() {
  card.innerHTML = `
    <h2>💖</h2>
    <p>
      I knew it.<br>
      But I still wanted to hear it.
    </p>
    <button class="primary" onclick="end()">I love you 🤍</button>
    <button class="secondary" onclick="end()">Still not smiling?</button>
  `;
}

/* NO PATH — FUN DILEMMA */
function noPath() {
  card.innerHTML = `
    <h2>Oh 😌</h2>
    <p>
      Bold choice.<br>
      Are you saying no because -
    </p>
    <button class="primary" onclick="caught()">You enjoy testing me</button>
    <button class="secondary" onclick="caught()">You want to see what happens</button>
  `;
}

/* CAUGHT → LAUGH → FORWARD */
function caught() {
  card.innerHTML = `
    <h2>There it is 😂</h2>
    <p>
      Either way, you’re smiling right now.<br><br>
      And that’s all I needed to know.
    </p>
    <button class="primary" onclick="end()">Okay fine 🤍</button>
    <button class="secondary" onclick="end()">I got caught</button>
  `;
}

/* END */
function end() {
  card.innerHTML = `
    <h2>🤍</h2>
    <p>
      Thank you for playing along.<br>
      I choose you, everyday cutiee.
      <br><br>
      Happy first Valentine’s Day Babe 💕
    </p>
  `;
}

scene1();
</script>
</body>
</html>
