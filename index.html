<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Swapnil 🤍</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card {
    background: white;
    padding: 35px;
    max-width: 420px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: fade 0.8s ease;
  }
  h2 { color: #ff4d6d; }
  p { color: #444; line-height: 1.6; }
  button {
    margin-top: 14px;
    padding: 12px 24px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  .primary { background: #ff4d6d; color: white; }
  .secondary { background: #eee; color: #333; }
  button:hover { transform: scale(1.05); }

  @keyframes fade {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>
<div class="card" id="card"></div>

<script>
const card = document.getElementById("card");

/* SCENE 1 — ENTRY */
function scene1() {
  card.innerHTML = `
    <h2>Swapnil.</h2>
    <p>
      This is a serious message.<br>
      By serious, I mean… me.
    </p>
    <button class="primary" onclick="scene2()">I’m ready</button>
    <button class="secondary" onclick="scene2()">I already regret this</button>
  `;
}

/* SCENE 2 — FUN DRAMA SETUP */
function scene2() {
  card.innerHTML = `
    <h2>Good.</h2>
    <p>
      Because you clicked.<br>
      And that’s commitment.
    </p>
    <button class="primary" onclick="scene3()">Continue</button>
    <button class="secondary" onclick="scene3()">I feel trapped</button>
  `;
}

/* SCENE 3 — DILEMMA QUESTION */
function scene3() {
  card.innerHTML = `
    <h2>Quick question 😌</h2>
    <p>
      You’re dealing with my drama.<br>
      What do you do?
    </p>
    <button class="primary" onclick="scene4()">Try to stay calm</button>
    <button class="secondary" onclick="scene4()">Give up</button>
  `;
}

/* SCENE 4 — LAUGH + CONFIDENT OVERRIDE */
function scene4() {
  card.innerHTML = `
    <h2>Interesting.</h2>
    <p>
      Because whether you try to stay calm…<br>
      or you give up…<br><br>
      <strong>You already gave up.</strong>
    </p>
    <p>
      Relax. I’m smiling.
    </p>
    <button class="primary" onclick="scene5()">Okay 😅</button>
    <button class="secondary" onclick="scene5()">I had no choice</button>
  `;
}

/* SCENE 5 — FAKE EXIT */
function scene5() {
  card.innerHTML = `
    <h2>Before we continue…</h2>
    <p>
      You’re allowed to leave now.<br>
      No hard feelings.
    </p>
    <button class="primary" onclick="fakeExit()">Exit safely</button>
    <button class="secondary" onclick="scene6()">Stay. I’m curious</button>
  `;
}

function fakeExit() {
  card.innerHTML = `
    <h2>Error 😌</h2>
    <p>
      Exit not found.<br>
      Nice try though.
    </p>
    <button class="primary" onclick="scene6()">Continue anyway</button>
    <button class="secondary" onclick="scene6()">I knew this would happen</button>
  `;
}

/* SCENE 6 — FINAL QUESTION */
function scene6() {
  card.innerHTML = `
    <h2>Okay. One last thing 💌</h2>
    <p>
      This is our first Valentine’s Day.<br><br>
      I wanted to ask you properly.
      <br><br>
      <strong>Will you be my Valentine?</strong>
    </p>
    <button class="primary" onclick="end()">Yes 💖</button>
    <button class="secondary" onclick="end()">Obviously yes 😏</button>
  `;
}

/* END */
function end() {
  card.innerHTML = `
    <h2>🤍</h2>
    <p>
      Thank you for choosing me.<br>
      I choose you — every day.
      <br><br>
      Happy first Valentine’s Day.
    </p>
  `;
}

scene1();
</script>
</body>
</html>
